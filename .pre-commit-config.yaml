repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: agent-mail-guard
        name: agent-mail lease guard
        entry: pwsh -NoProfile -File C:/Users/lefto/.claude/tools/agent-mail/guard-check.ps1
        language: system
        pass_filenames: true
        stages: [pre-commit]

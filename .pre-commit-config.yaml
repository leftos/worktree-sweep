repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd)$'

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: agent-mail-guard
        name: agent-mail lease guard
        entry: pwsh -NoProfile -File tools/agent-mail-guard.ps1
        language: system
        pass_filenames: true
        stages: [pre-commit]
